services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
      NEXORA_DATA_DIR: /data
      NEXORA_API_BASE: http://web:8080
      NEXORA_PANEL_URL: ${NEXORA_PANEL_URL:-https://members-sacrifice-criteria-grip.trycloudflare.com/admin/panel}
    volumes:
      - ./app/data:/data
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXORA_DATA_DIR: /data
      PORT: "8080"
    volumes:
      - ./app/data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
